</head><body class="bg-background font-body-md text-body-md text-on-surface flex flex-col min-h-screen"><main class="flex-1 flex flex-col relative w-full pt-safe pb-safe bg-background"><div class="flex flex-col w-full relative px-space-base pb-space-2xl">

<div class="relative flex items-center justify-center mb-space-md">

<div class="grid grid-cols-2 gap-space-sm"><button class="group relative flex flex-col items-start p-space-md rounded-xl bg-[#121214] border border-[#cfffe2] transition-all duration-300 text-left overflow-hidden" onclick="selectTheme(this)" type="button"><div class="w-full flex items-center justify-between mb-space-sm relative z-10"><div class="w-7 h-7 rounded-full bg-[#0a0a0b] border border-white/10 flex items-center justify-center"><span class="w-3.5 h-3.5 rounded-full bg-[#cfffe2]"></span></div><span class="font-label-sm text-label-sm bg-[#cfffe2]/15 text-[#cfffe2] border border-[#cfffe2]/30 px-space-xs py-0.5 rounded-full">NEW</span></div><span class="font-headline-sm text-headline-sm text-on-surface relative z-10">Mint Stealth</span><span class="font-body-sm text-body-sm text-on-surface-variant relative z-10">Signature lounge vibe</span><div class="theme-check absolute bottom-space-md right-space-md w-5 h-5 rounded-full bg-[#cfffe2] flex items-center justify-center text-[#0a0a0b]"><span class="material-symbols-outlined text-[14px]">check</span></div></button><button class="group relative flex flex-col items-start p-space-md rounded-xl bg-[#0e0e10] border border-white/5 hover:border-white/15 transition-all duration-300 text-left overflow-hidden" onclick="selectTheme(this)" type="button"><div class="w-full flex items-center justify-between mb-space-sm relative z-10"><div class="w-7 h-7 rounded-full bg-[#0a0a0b] border border-white/10 flex items-center justify-center"><span class="w-3.5 h-3.5 rounded-full bg-emerald-400"></span></div></div><span class="font-headline-sm text-headline-sm text-on-surface relative z-10">Cyber Emerald</span><span class="font-body-sm text-body-sm text-on-surface-variant relative z-10">Matrix slate &amp; mint</span><div class="theme-check hidden absolute bottom-space-md right-space-md w-5 h-5 rounded-full bg-[#cfffe2] flex items-center justify-center text-[#0a0a0b]"><span class="material-symbols-outlined text-[14px]">check</span></div></button><button class="group relative flex flex-col items-start p-space-md rounded-xl bg-[#0e0e10] border border-white/5 hover:border-white/15 transition-all duration-300 text-left overflow-hidden" onclick="selectTheme(this)" type="button"><div class="w-full flex items-center justify-between mb-space-sm relative z-10"><div class="w-7 h-7 rounded-full bg-[#0a0a0b] border border-white/10 flex items-center justify-center"><span class="w-3.5 h-3.5 rounded-full bg-indigo-400"></span></div><span class="font-label-sm text-label-sm bg-surface-bright text-on-surface-variant border border-white/5 px-space-xs py-0.5 rounded-full">NEW</span></div><span class="font-headline-sm text-headline-sm text-on-surface relative z-10">Midnight Tokyo</span><span class="font-body-sm text-body-sm text-on-surface-variant relative z-10">Deep indigo slate</span><div class="theme-check hidden absolute bottom-space-md right-space-md w-5 h-5 rounded-full bg-[#cfffe2] flex items-center justify-center text-[#0a0a0b]"><span class="material-symbols-outlined text-[14px]">check</span></div></button><button class="group relative flex flex-col items-start p-space-md rounded-xl bg-[#0e0e10] border border-white/5 hover:border-white/15 transition-all duration-300 text-left overflow-hidden" onclick="selectTheme(this)" type="button"><div class="w-full flex items-center justify-between mb-space-sm relative z-10"><div class="w-7 h-7 rounded-full bg-[#0a0a0b] border border-white/10 flex items-center justify-center"><span class="w-3.5 h-3.5 rounded-full bg-zinc-600"></span></div></div><span class="font-headline-sm text-headline-sm text-on-surface relative z-10">Pure OLED</span><span class="font-body-sm text-body-sm text-on-surface-variant relative z-10">Pitch black &amp; stark</span><div class="theme-check hidden absolute bottom-space-md right-space-md w-5 h-5 rounded-full bg-[#cfffe2] flex items-center justify-center text-[#0a0a0b]"><span class="material-symbols-outlined text-[14px]">check</span></div></button></div>
</div>
<div class="flex flex-col gap-space-xs">
<span class="font-label-md text-label-md text-on-surface">Interface Density</span>
<div class="grid grid-cols-3 p-1 bg-[#0a0a0b] border border-white/10 rounded-full gap-1"><button class="py-space-xs px-space-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:text-white transition-all text-center" onclick="setDensity(this)" type="button">Compact</button><button class="py-space-xs px-space-sm rounded-full font-label-md text-label-md bg-[#cfffe2] text-[#0a0a0b] font-semibold transition-all text-center" onclick="setDensity(this)" type="button">Default</button><button class="py-space-xs px-space-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:text-white transition-all text-center" onclick="setDensity(this)" type="button">Spacious</button></div>
</div>
<div class="flex flex-col gap-space-sm bg-[#0e0e10] border border-white/10 p-space-md rounded-xl">
<div class="flex items-center justify-between">
<div class="flex items-center gap-space-xs">
<span class="material-symbols-outlined text-white text-[20px]">auto_awesome</span>
<span class="font-label-md text-label-md text-on-surface">Glow Effects Intensity</span>
</div>
<span class="font-label-sm text-label-sm text-white bg-[#18181c] border border-white/10 px-space-xs py-0.5 rounded-full" id="glowVal">85%</span>
</div>
<div class="relative flex items-center">
<input aria-label="Glow Effects Intensity" class="w-full h-1.5 bg-[#222226] rounded-full appearance-none cursor-pointer accent-[#cfffe2]" id="glowRange" max="100" min="0" oninput="document.getElementById('glowVal').innerText = this.value + '%'" type="range" value="85">
</div>
<div class="flex justify-between font-label-sm text-label-sm text-on-surface-variant px-0.5">
<span>Subtle</span>
<span>Hyper-Glow</span>
</div>
</div>
<div class="flex flex-col gap-space-sm mt-space-xs"><button class="w-full py-space-md rounded-full bg-[#cfffe2] hover:bg-[#b8f5d0] text-[#0a0a0b] font-label-lg text-label-lg font-semibold transition-all flex items-center justify-center gap-space-xs active:scale-[0.99]" type="button"><span class="">Apply Changes</span><span class="material-symbols-outlined text-[18px] text-[#0a0a0b]">bolt</span></button><button class="w-full py-space-xs text-center font-label-md text-label-md text-[#f6f6f6]/60 hover:text-[#f6f6f6] transition-colors" type="button">Cancel</button></div>
</div>
</div>
<script>
  function selectTheme(btn) {
    const parent = btn.parentElement;
    const cards = parent.querySelectorAll('button');
    cards.forEach(card => {
      card.classList.remove('bg-[#18181c]', 'border-white/20');
      card.classList.add('bg-[#0e0e10]', 'border-white/5');
      const check = card.querySelector('.theme-check');
      if (check) check.classList.add('hidden');
    });
    btn.classList.remove('bg-[#0e0e10]', 'border-white/5');
    btn.classList.add('bg-[#18181c]', 'border-white/20');
    const check = btn.querySelector('.theme-check');
    if (check) check.classList.remove('hidden');
  }

  function setDensity(btn) {
    const parent = btn.parentElement;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach(b => {
      b.className = 'py-space-xs px-space-sm rounded-full font-label-md text-label-md text-on-surface-variant hover:text-white transition-all text-center';
    });
    btn.className = 'py-space-xs px-space-sm rounded-full font-label-md text-label-md bg-[#222226] text-white border border-white/10 shadow transition-all text-center';
  }
</script></main>

</body></html>
