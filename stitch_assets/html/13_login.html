<script>
  (function() {
    const pwInput = document.getElementById('password');
    const togglePw = document.getElementById('toggle-pw');
    const eyeIcon = document.getElementById('eye-icon');
    if (togglePw && pwInput && eyeIcon) {
      togglePw.addEventListener('click', () => {
        const isPw = pwInput.getAttribute('type') === 'password';
        pwInput.setAttribute('type', isPw ? 'text' : 'password');
        eyeIcon.textContent = isPw ? 'visibility_off' : 'visibility';
      });
    }

    const toggleRemember = document.getElementById('toggle-remember');
    const switchThumb = document.getElementById('switch-thumb');
    let isRemembered = true;
    if (toggleRemember && switchThumb) {
      toggleRemember.addEventListener('click', () => {
        isRemembered = !isRemembered;
        toggleRemember.setAttribute('aria-checked', isRemembered ? 'true' : 'false');
        if (isRemembered) {
          toggleRemember.classList.remove('bg-surface-container-highest');
          toggleRemember.classList.add('bg-secondary');
          switchThumb.classList.remove('translate-x-0', 'bg-outline');
          switchThumb.classList.add('translate-x-4', 'bg-on-secondary');
        } else {
          toggleRemember.classList.remove('bg-secondary');
          toggleRemember.classList.add('bg-surface-container-highest');
          switchThumb.classList.remove('translate-x-4', 'bg-on-secondary');
          switchThumb.classList.add('translate-x-0', 'bg-outline');
        }
      });
    }

    const loginId = document.getElementById('login-id');
    const statusBadge = document.getElementById('status-badge');
    if (loginId && statusBadge) {
      loginId.addEventListener('input', (e) => {
        if (e.target.value.length >= 3) {
          statusBadge.classList.remove('hidden');
        } else {
          statusBadge.classList.add('hidden');
        }
      });
    }
  })();
</script></main></body></html>
